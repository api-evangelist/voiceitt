aid: voiceitt
name: Voiceitt
description: >-
  Voiceitt builds inclusive voice AI — automatic speech recognition designed for
  people with non-standard speech, including speech disabilities, aging adults,
  and accented speakers. Its speaker-independent and personalized speech-to-text
  power an AAC/dictation app, live captioning integrations for Zoom, Microsoft
  Teams, and WebEx, a Chrome extension, and Alexa smart-home control. Developers
  integrate the same engine through the Voiceitt HTTP API (JWT-authenticated
  audio-file transcription at api2.voiceitt.com) and a Socket.IO WebSockets API
  for real-time streaming recognition with partial results.
