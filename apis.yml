apis:
- name: Voiceitt WebSockets API
  description: >-
    Socket.IO WebSockets API for real-time speech recognition. After JWT login via the HTTP API, clients
    set recognition options (set_options), then send recognize_audio_samples for pre-segmented speech
    or stream_audio_samples / stream_compressed_audio for continuous PCM (16 kHz mono) or compressed audio,
    receiving chronologically ordered recognition and partial_recognition events with segment timing.
  humanURL: https://voiceitt-si-api.readme.io/reference/getting-started-with-your-api-1
